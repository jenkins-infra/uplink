services:
  db:
    image: postgres:17
    volumes:
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      - 'POSTGRES_PASSWORD=jenkinsuplink'
      - 'POSTGRES_USER=postgres'
      # Used for psql non-interactive scripting
      - 'PGPASSWORD=jenkinsuplink'
      - 'POSTGRES_DB=uplink_development'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "uplink_development"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  uplink:
    build:
      context: ./
    env_file:
      # .gitignored: you have to set it up yourself
      - path: ./.secrets.env
        required: false
    environment:
      - DB_TRACING=true
      - NODE_ENV
    ports:
      - 3030:3030
    depends_on:
      db:
        condition: service_healthy
        restart: true # Restart uplink if the DB is restarted (new configuration)
    healthcheck:
      test: ["CMD-SHELL", "curl --head http://localhost:3030"]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 2s

  dev-uplink:
    extends: uplink
    build:
      target: builder
    entrypoint: 'node /srv/uplink/node_modules/.bin/nodemon build'
    ports:
      - 9229:9229
